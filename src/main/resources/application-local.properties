spring.application.name=hostelp-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/hostelp
spring.datasource.username=hostelp
spring.datasource.password=${DB_PASSWORD}

# Flyway gere le schema, Hibernate se contente de le verifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
