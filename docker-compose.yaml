services:
  postgres:
    image: postgres:16-alpine
    container_name: hostelp-postgres
    environment:
      POSTGRES_DB: hostelp
      POSTGRES_USER: hostelp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostelp -d hostelp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: